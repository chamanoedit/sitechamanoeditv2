<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chama Studio</title>
<meta name="description" content="Monte a cena em 3D, mova a câmera com lentes reais ou com o giroscópio do celular e salve o vídeo de previs para animar no Higgsfield.">
<meta property="og:title" content="Chama Studio">
<meta property="og:description" content="Monte a cena em 3D, mova a câmera com lentes reais ou com o giroscópio do celular e salve o vídeo de previs para animar no Higgsfield.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#131312">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1b19'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23e5482d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: light; }
  html, body { overscroll-behavior: none; }
  #app { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  @supports (height: 100dvh) { #app { height: 100dvh; } }

  /* Layout: one screen. The picture takes everything; a single quiet bar underneath holds the three ways
     to move the camera, the timeline and the record button. Controls borrow from a viewfinder: focal
     lengths as numerals, a tally light, timecode in mono. Red is reserved for recording. */
  :root {
    --bg: #eceae5; --stage: #dcd9d2; --panel: #faf9f6; --ink: #1c1b19; --muted: #6d6a64; --line: #d9d5cd;
    --chip: #efede8; --glass: rgba(250, 249, 246, 0.88); --rec: #d93a26; --rail: #2b63d9; --wedge: rgba(28, 27, 25, 0.16);
    --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131312; --stage: #0b0b0a; --panel: #1d1c1b; --ink: #f2f0eb; --muted: #9b978f; --line: #32302d;
      --chip: #282725; --glass: rgba(29, 28, 27, 0.86); --rec: #f0503a; --rail: #6f9cff; --wedge: rgba(242, 240, 235, 0.2); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #131312; --stage: #0b0b0a; --panel: #1d1c1b; --ink: #f2f0eb; --muted: #9b978f; --line: #32302d;
    --chip: #282725; --glass: rgba(29, 28, 27, 0.86); --rec: #f0503a; --rail: #6f9cff; --wedge: rgba(242, 240, 235, 0.2); color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--rail); outline-offset: 2px; }
  svg { display: block; }

  #app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- the picture ---------- */
  #stage { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; background: var(--stage); touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ink { pointer-events: none; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); }

  #top { position: absolute; inset: 10px 10px auto 10px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #lead { flex: 1; min-width: 0; max-width: 520px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; justify-items: start; }
  #ask { width: 100%; margin: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 20px; }
  #ask svg { flex: none; color: var(--muted); }
  #ask-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14px; }
  #ask-input::placeholder { color: var(--muted); }
  #ask-go { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
  #ask-go[disabled] { opacity: 0.25; cursor: default; }
  #ask.busy #ask-go { background: var(--chip); color: var(--ink); }
  #ask-photo { flex: none; width: 30px; height: 30px; margin-right: -2px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  #ask-photo:hover, #ask-photo:focus-visible { color: var(--ink); }
  #ask.busy #ask-photo { visibility: hidden; }

  /* Photos of the real place: they go to Claude with the request, and any of them can be laid over the 3D to compare. */
  #shots { max-width: 100%; display: flex; gap: 6px; padding: 5px; border-radius: 14px; overflow-x: auto; scrollbar-width: none; }
  #shots::-webkit-scrollbar { display: none; }
  .shot { position: relative; flex: none; }
  .shot .pic { display: block; width: 44px; height: 44px; border-radius: 9px; overflow: hidden; border: 2px solid transparent; background: var(--chip); }
  .shot .pic[aria-pressed="true"] { border-color: var(--rail); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .shot .x { position: absolute; top: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--panel); }
  .shot .x::before { content: ""; position: absolute; inset: -7px; }
  #ghost { position: absolute; object-fit: contain; opacity: 0.5; pointer-events: none; }
  #app:not([data-state="live"]) #ghost { display: none; }
  #opts { height: 40px; padding: 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; }

  #lens { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 24px; }
  #lens button { min-width: 36px; height: 36px; padding: 0 8px; border-radius: 18px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); transition: background .15s, color .15s; }
  #lens button[aria-pressed="true"] { background: var(--ink); color: var(--panel); font-weight: 500; }
  #lens button[aria-pressed="true"]::after { content: "mm"; opacity: 0.7; margin-left: 1px; }
  #lens-live { font-family: var(--mono); font-size: 12.5px; padding: 0 10px 0 8px; color: var(--ink); }

  #home { position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  #gyro { position: absolute; right: 10px; top: 60px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  #gyro[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #swap { position: absolute; border-radius: 10px; }
  #tally { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 11px; border-radius: 20px;
    background: var(--rec); color: #fff; font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; }
  #tally i { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: clamp(72px, 18vw, 150px); font-weight: 500; color: #fff; text-shadow: 0 2px 30px rgba(0, 0, 0, .45); pointer-events: none; }
  #hint { position: absolute; left: 12px; right: 12px; bottom: 68px; margin-inline: auto; width: fit-content; max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 16px; font-size: 12.5px; color: var(--muted); text-align: center; transition: opacity .5s; pointer-events: none; }
  #hint.off { opacity: 0; }

  #stick { position: absolute; left: 14px; bottom: 66px; width: 104px; height: 104px; border-radius: 50%; touch-action: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: var(--ink); opacity: 0.85; }
  #lift { position: absolute; right: 14px; bottom: 66px; display: flex; flex-direction: column; gap: 6px; }
  #lift button { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; touch-action: none; }

  #veil { position: absolute; inset: 0; display: grid; place-items: center; background: var(--stage); }
  #veil div { width: min(300px, 80%); display: grid; gap: 12px; text-align: center; }
  #veil b { font-weight: 500; }
  #veil progress { width: 100%; height: 6px; appearance: none; -webkit-appearance: none; border: 0; border-radius: 3px; overflow: hidden; background: var(--chip); }
  #veil progress::-webkit-progress-bar { background: var(--chip); }
  #veil progress::-webkit-progress-value { background: var(--ink); }
  #veil progress::-moz-progress-bar { background: var(--ink); }
  #veil button { justify-self: center; color: var(--muted); padding: 6px 10px; }

  /* ---------- settings ---------- */
  #sheet { position: absolute; top: 58px; right: 10px; width: min(300px, calc(100% - 20px)); max-height: calc(100% - 70px); overflow: auto; padding: 14px; border-radius: 16px; display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0, 0, 0, .16); }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 12px; color: var(--muted); }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--chip); }
  .seg button { flex: 1; min-width: 0; height: 32px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .seg.mono button { font-family: var(--mono); font-size: 12.5px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links button { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--chip); font-size: 13px; }

  /* ---------- the bar ---------- */
  #dock { display: grid; gap: 8px; }
  #panel { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #moves { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding: 2px; scrollbar-width: none; flex: 1; }
  #moves::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 500; }
  #target { flex: none; height: 36px; padding: 0 10px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; max-width: 42vw; }
  #railbox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; flex: 1; min-width: 0; }
  #railbox label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #railbox output { font-family: var(--mono); font-size: 12.5px; color: var(--ink); min-width: 4.2em; }
  #railbox input[type="range"] { width: 96px; }
  #railbox .seg { width: 190px; }

  #bar { display: grid; grid-template-columns: auto auto minmax(60px, 1fr) auto auto; grid-template-areas: "modes play time clock act"; align-items: center; gap: 10px; }
  #modes { grid-area: modes; width: 264px; }
  #play { grid-area: play; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
  #time { grid-area: time; width: 100%; min-width: 0; }
  #clock { grid-area: clock; font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #clock b { color: var(--ink); font-weight: 500; }
  #act { grid-area: act; display: flex; gap: 8px; justify-content: flex-end; }
  .big { height: 42px; padding: 0 18px; border-radius: 21px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #rec { background: var(--rec); color: #fff; }
  #rec i { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  #app[data-state="rec"] #rec i, #app[data-state="count"] #rec i { border-radius: 2px; }
  #save { background: var(--ink); color: var(--panel); }
  #redo { background: var(--panel); border: 1px solid var(--line); }
  input[type="range"] { accent-color: var(--ink); height: 24px; margin: 0; }

  /* ---------- credit and next step: one quiet line under the bar ---------- */
  #foot { display: flex; align-items: center; gap: 14px; min-height: 30px; font-size: 12.5px; color: var(--muted); }
  #brand { flex: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #brand b, #brand a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; text-decoration: none; }
  #brand a:hover { text-decoration: underline; }
  #brand svg, #brand img { height: 14px; width: auto; }
  #pitch { flex: 1; min-width: 0; text-align: center; }
  #tutorial { flex: none; margin-left: auto; height: 30px; padding: 0 14px; border-radius: 15px; display: inline-flex; align-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 13px; font-weight: 500; text-decoration: none; }
  #app[data-saved] #pitch { color: var(--ink); }
  #app[data-saved] #tutorial { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  @media (pointer: coarse) { #tutorial { height: 36px; border-radius: 18px; } #brand a { padding-block: 9px; } }

  #toast { position: fixed; left: 16px; right: 16px; top: calc(74px + env(safe-area-inset-top, 0px)); margin-inline: auto; width: fit-content; max-width: min(440px, calc(100% - 32px)); padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--panel); font-size: 13.5px; text-align: center; z-index: 5; }

  #app[data-state="count"] #top, #app[data-state="rec"] #top, #app[data-state="review"] #top, #app[data-state="export"] #top,
  #app[data-state="review"] #lens, #app[data-state="export"] #lens, #app[data-state="export"] #home, #app[data-state="review"] #home, #app[data-state="export"] #gyro, #app[data-state="review"] #gyro,
  #app[data-state="count"] #hint, #app[data-state="rec"] #hint, #app[data-state="review"] #hint, #app[data-state="export"] #hint { display: none; }
  #app[data-state="review"] #panel, #app[data-state="export"] #panel, #app[data-state="review"] #modes, #app[data-state="export"] #modes { display: none; }
  #app[data-state="review"] #bar, #app[data-state="export"] #bar { grid-template-columns: auto minmax(60px, 1fr) auto auto; grid-template-areas: "play time clock act"; }

  #app[data-state="count"] #panel, #app[data-state="rec"] #panel { display: none; }
  #app[data-state="count"] #modes, #app[data-state="rec"] #modes, #app[data-state="count"] #foot, #app[data-state="rec"] #foot { opacity: 0.35; pointer-events: none; }

  @media (max-width: 720px) {
    #bar { grid-template-columns: auto minmax(40px, 1fr) auto; grid-template-areas: "modes modes act" "play time clock"; }
    #modes { width: auto; }
    #modes button { flex: 1 1 auto; padding: 0 8px; }
    #app[data-state="review"] #bar, #app[data-state="export"] #bar { grid-template-columns: auto minmax(40px, 1fr) auto; grid-template-areas: "play time clock" "act act act"; }
    #app[data-state="review"] #act > * { flex: 1; justify-content: center; }
    .big { padding: 0 14px; }
    #lens button { min-width: 32px; height: 34px; padding: 0 6px; }
    #railbox input[type="range"] { width: 76px; }
    #hint { bottom: 186px; }
    #app[data-photos] #toast { top: calc(136px + env(safe-area-inset-top, 0px)); }
    /* Narrow screens: the credit while shooting, the next step once there is a take. */
    #pitch { display: none; text-align: left; }
    #app[data-state="review"] #pitch, #app[data-state="export"] #pitch { display: block; }
    #app[data-state="review"] #brand, #app[data-state="export"] #brand { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app" data-state="live">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ink"></canvas>
    <img id="ghost" alt="" hidden>

    <div id="top">
      <div id="lead">
      <form id="ask" class="glass" autocomplete="off">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0l1.6 4.9L14.5 6.5 9.6 8.1 8 13 6.4 8.1 1.5 6.5l4.9-1.6zM13 11l.7 2.3L16 14l-2.3.7L13 17l-.7-2.3L10 14l2.3-.7z"/></svg>
        <input id="ask-input" type="text" enterkeyhint="send" spellcheck="false">
        <button id="ask-photo" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><circle cx="5.6" cy="6.3" r="1.1"/><path d="M2.3 11.5l3.3-3.1 2.6 2.4 2.2-2 3.3 2.9"/></svg>
        </button>
        <button id="ask-go" type="submit" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"/></svg>
        </button>
      </form>
      <div id="shots" class="glass" hidden></div>
      <input id="photo-file" type="file" accept="image/*" multiple hidden>
      </div>
      <button id="opts" class="glass" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="opts-ratio">16:9</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4h6M11 4h1.5M1.5 10H3M6.5 10h6"/><circle cx="9.2" cy="4" r="1.7"/><circle cx="4.8" cy="10" r="1.7"/></svg>
      </button>
    </div>

    <button id="swap" type="button" hidden></button>
    <div id="hint" class="glass off"></div>
    <div id="lens" class="glass" role="group"></div>
    <button id="home" class="glass" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3"/></svg>
    </button>
    <button id="gyro" class="glass" type="button" aria-pressed="false" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3.5" width="6" height="11" rx="1.4"/><path d="M2.2 7.2A7.4 7.4 0 0 1 4 4.4M2.2 7.2l-.4-2M2.2 7.2l2-.3M15.8 10.8a7.4 7.4 0 0 1-1.8 2.8M15.8 10.8l.4 2M15.8 10.8l-2 .3"/></svg>
    </button>
    <div id="stick" class="glass" hidden><i></i></div>
    <div id="lift" hidden>
      <button id="lift-up" class="glass" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></button>
      <button id="lift-down" class="glass" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
    </div>
    <div id="tally" hidden><i></i><span id="tally-time">0:00.0</span></div>
    <div id="count" hidden></div>
    <div id="veil" hidden><div><b id="veil-text"></b><progress id="veil-bar" max="1" value="0"></progress><button id="veil-stop" type="button"></button></div></div>

    <div id="sheet" hidden>
      <div class="field"><span data-t="format"></span><div class="seg mono" id="ratios"></div></div>
      <div class="field"><span data-t="look"></span><div class="seg" id="looks"></div></div>
      <div class="field"><span data-t="handheld"></span><div class="seg" id="shakes"></div></div>
      <div class="field"><span data-t="scene"></span><div class="links"><button id="scene-copy" type="button"></button><button id="scene-undo" type="button" hidden></button><button id="scene-reset" type="button" hidden></button></div></div>
    </div>
  </div>

  <div id="dock">
    <div id="panel" hidden>
      <select id="target" hidden></select>
      <div id="moves" hidden></div>
      <div id="railbox" hidden>
        <label><span data-t="h0"></span><input id="rail-h0" type="range" min="0.3" max="25" step="0.1" value="1.6"><output id="rail-h0-out"></output></label>
        <label><span data-t="h1"></span><input id="rail-h1" type="range" min="0.3" max="25" step="0.1" value="1.6"><output id="rail-h1-out"></output></label>
        <div class="seg" id="aims"></div>
      </div>
    </div>
    <div id="bar">
      <div class="seg" id="modes" role="tablist"></div>
      <button id="play" type="button"></button>
      <input id="time" type="range" min="0" max="1000" value="0" step="1">

  }

    M.pose(t, C.cam);
    const focal = C.playTake(t);
    W.focusShadow(C.cam.position.x, C.cam.position.z);
    W.sky.position.copy(C.cam.position);

  X.render = async (onProgress, signal) => {
    if (X.busy || !C.take) throw { code: 'busy' };

/* Previs Studio — scenes as data: tidy what comes in, remember it, and ask Claude to write one from a description. */
(function (PV) {
  'use strict';

      objects: Array.isArray(raw.objects) ? raw.objects.slice(0, 500) : [],
      actors: Array.isArray(raw.actors) ? raw.actors.slice(0, 24) : [],
      focus: raw.focus, camera: raw.camera && typeof raw.camera === 'object' ? raw.camera : null

    if (B.partnerLogo) partner.insertAdjacentHTML('afterbegin', B.partnerLogo);
    plus.textContent = '+';
    host.append(partner, plus, name(B.author, B.authorUrl));
    const tut = el('tutorial'); tut.textContent = PV.t('tutorial');
    if (B.tutorialUrl) { tut.href = B.tutorialUrl; tut.target = '_blank'; tut.rel = 'noopener'; tut.removeAttribute('role'); }
    else tut.addEventListener('click', (e) => { e.preventDefault(); U.toast(PV.t('tutorialSoon'), 4200); });
  }

  const closeSheet = () => { el('sheet').hidden = true; el('opts').setAttribute('aria-expanded', 'false'); };

  function wireButtons() {
    el('play').addEventListener('click', A.togglePlay);
    el('rec').addEventListener('click', A.record);
    el('redo').addEventListener('click', A.retake);
    el('save').addEventListener('click', A.save);
    el('veil-stop').addEventListener('click', () => A.abort && A.abort.abort());
    el('home').addEventListener('click', () => { if (C.move) { C.move = null; } C.frame(A.t); A.refresh(); });
    el('swap').addEventListener('click', () => { A.railView = A.railView === 'map' ? 'cam' : 'map'; A.refresh(); U.hint(PV.t(A.railView === 'map' ? 'hintRailMap' : 'hintRailCam')); });
    el('opts').addEventListener('click', () => { const s = el('sheet'); s.hidden = !s.hidden; el('opts').setAttribute('aria-expanded', String(!s.hidden)); });

    const time = el('time');
    time.addEventListener('input', () => { A.scrub = true; const end = A.state === 'review' && C.take ? C.take.dur : M.duration; A.t = time.value / 1000 * end; });
    time.addEventListener('change', () => { A.scrub = false; });
    time.addEventListener('pointerup', () => { A.scrub = false; });

    el('target').addEventListener('change', (e) => {
      C.subject = M.subjects[+e.target.value] || C.subject;
      if (C.move) C.setMove(C.move.name, A.t);
    });
    const height = (id, key) => {
      const input = el(id), out = el(id + '-out'), show = () => { C[key] = +input.value; out.textContent = (+input.value).toFixed(1).replace('.', PV.lang === 'pt' ? ',' : '.') + ' m'; };
      input.addEventListener('input', show); show();
    };
    height('rail-h0', 'railH0'); height('rail-h1', 'railH1');

    const input = el('ask-input'), go = el('ask-go');
    go.innerHTML = U.icon('up');
    input.addEventListener('input', A.askState);
    el('ask').addEventListener('submit', (e) => { e.preventDefault(); A.ask(input.value); });
    /* Inside Claude the page can ask for a scene itself, and show Claude the photos where that is allowed. */
    A.canAsk = !!(window.claude && window.claude.use); A.canSee = false;
    A.askState();
    if (A.canAsk) window.claude.use('sample').then(async (s) => {
      if (!s) { A.canAsk = false; A.askState(); return; }
      const caps = s.limits ? await s.limits().catch(() => null) : null;
      A.canSee = !!(caps && caps.images);
      if (A.canSee) A.maxPhotos = PV.clamp(PV.num(caps.images.maxCount, 6), 1, 6);
    });

    /* Photos come in through the button, a paste (a screenshot is usually on the clipboard) or a drop on the page.
       A pasted answer from Claude is taken straight away, wherever on the page it lands. */
    const file = el('photo-file');
    el('ask-photo').addEventListener('click', () => file.click());
    file.addEventListener('change', () => { const picked = Array.from(file.files || []); file.value = ''; A.addPhotos(picked); });
    document.addEventListener('paste', (e) => {
      const cd = e.clipboardData; if (!cd || A.state !== 'live' || A.asking) return;
      const pics = Array.from(cd.files || []).filter((f) => /^image\//.test(f.type || ''));
      if (pics.length) { e.preventDefault(); A.addPhotos(pics); return; }
      const text = cd.getData('text/plain') || '', scene = text.indexOf('{') >= 0 ? S.extract(text) : null;
      if (scene) { e.preventDefault(); closeSheet(); A.arrive(scene); }
    });
    const app = el('app'), carriesFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    app.addEventListener('dragover', (e) => { if (carriesFiles(e)) e.preventDefault(); });
    app.addEventListener('drop', (e) => { if (!carriesFiles(e)) return; e.preventDefault(); A.addPhotos(e.dataTransfer.files); });

    el('scene-copy').addEventListener('click', async () => {
      const text = JSON.stringify(M.scene);
      try { await navigator.clipboard.writeText(text); U.toast(PV.t('copied')); }
      catch (e) { closeSheet(); input.value = text; input.focus(); input.select(); }
    });
    el('scene-undo').addEventListener('click', () => { const prev = S.history.pop(); if (!prev) return; A.photoScene = false; A.loadScene(prev); S.remember(prev, PV.DEFAULT_ID); closeSheet(); });
    el('scene-reset').addEventListener('click', () => { S.history.push(M.scene); A.custom = false; A.photoScene = false; S.forget(); A.loadScene(S.clean(JSON.parse(JSON.stringify(PV.DEFAULT_SCENE)))); closeSheet(); });
  }

  function wireStage() {
    const stage = el('stage'), pts = new Map();
    let pinch = 0, centre = null, drawing = false;
    const isControl = (t) => !!(t && t.closest && t.closest('button, input, form, select, #sheet, #shots, #stick, #lift, #veil'));
    const local = (e) => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const two = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a[0] - b[0], a[1] - b[1]), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; };

    stage.addEventListener('pointerdown', (e) => {
      if (isControl(e.target)) return;
      closeSheet(); el('ask-input').blur();
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
      const p = local(e); pts.set(e.pointerId, p);
      if (pts.size === 1 && A.mapMain()) { drawing = true; Mp.beginStroke(p[0], p[1], A.rects.full); }
      if (pts.size === 2) { if (drawing) { drawing = false; Mp.stroke = null; } const t = two(); pinch = t.d; centre = t.c; }
      if (!A.asking) U.hint('');
    });
    stage.addEventListener('pointermove', (e) => {
      const last = pts.get(e.pointerId); if (!last) return;
      const p = local(e), dx = p[0] - last[0], dy = p[1] - last[1]; pts.set(e.pointerId, p);
      if (pts.size === 1) {
        if (drawing) Mp.addStroke(p[0], p[1], A.rects.full);
        else if (!A.mapMain() && A.state !== 'review') { C.input.dx += dx; C.input.dy += dy; }
      } else if (pts.size === 2) {
        const t = two();
        if (A.mapMain()) { Mp.zoomAt(t.c[0], t.c[1], A.rects.full, t.d / (pinch || t.d)); Mp.cx -= (t.c[0] - centre[0]) / Mp.scale; Mp.cz -= (t.c[1] - centre[1]) / Mp.scale; }
        else if (A.state !== 'review') C.input.zoom -= (t.d - pinch) * 2.4;
        pinch = t.d; centre = t.c;
      }
    });
    const up = (e) => {
      if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
      if (drawing && pts.size === 0) { drawing = false; if (Mp.endStroke()) { A.refresh(); U.hint(PV.t('hintRailDone')); } }
    };
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', (e) => {
      if (e.target.closest && e.target.closest('#sheet')) return;
      e.preventDefault();
      const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY, p = local(e);
      if (A.mapMain()) Mp.zoomAt(p[0], p[1], A.rects.full, Math.exp(-d * 0.0016));
      else if (A.state !== 'review') C.input.zoom += d;
    }, { passive: false });

    /* Touch: a stick to walk the camera and two buttons to raise or lower it. */
    const stick = el('stick'), knob = stick.firstElementChild; let sid = null;
    const stickMove = (e) => {
      const r = stick.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
      const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
      knob.style.transform = 'translate(' + x * 30 + 'px,' + y * 30 + 'px)'; C.input.x = x; C.input.z = -y;
    };
    const stickEnd = (e) => { if (e.pointerId !== sid) return; sid = null; knob.style.transform = ''; C.input.x = C.input.z = 0; };
    stick.addEventListener('pointerdown', (e) => { sid = e.pointerId; try { stick.setPointerCapture(sid); } catch (err) { /* fine */ } stickMove(e); });
    stick.addEventListener('pointermove', (e) => { if (e.pointerId === sid) stickMove(e); });
    stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
    for (const [id, dir] of [['lift-up', 1], ['lift-down', -1]]) {
      const b = el(id), off = () => { C.input.y = 0; };
      b.addEventListener('pointerdown', (e) => { try { b.setPointerCapture(e.pointerId); } catch (err) { /* fine */ } C.input.y = dir; });
      b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off);
    }
  }

  function wireKeys() {
    const keys = {};
    const typing = () => { const a = document.activeElement; return !!a && ((a.tagName === 'INPUT' && a.type === 'text') || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); };
    const apply = () => {
      C.input.z = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
      C.input.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      C.input.y = (keys.e ? 1 : 0) - (keys.q ? 1 : 0); C.input.fast = !!keys.shift;
    };
    window.addEventListener('keydown', (e) => {
      if (typing() || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === ' ') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); A.togglePlay(); return; }
      if (k === 'escape') { closeSheet(); return; }
      if (k >= '1' && k <= '6') { C.focalTarget = C.LENSES[+k - 1]; return; }
      if (k.startsWith('arrow')) e.preventDefault();
      keys[k] = true; apply();
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; apply(); });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; apply(); });
  }

  A.start = () => {
    W.init(el('gl')); C.init(); Mp.init();
    A.g = el('ink').getContext('2d'); A.theme = U.theme();
    const saved = PV.store.get('prefs'); if (saved && typeof saved === 'object') Object.assign(A.prefs, saved);
    if (!A.RATIOS[A.prefs.ratio]) A.prefs.ratio = '16:9';
    U.labels(); buildControls(); buildBrand(); wireButtons(); wireStage(); wireKeys();
    A.applyPrefs(); A.layout();
    const kept = S.recall(PV.DEFAULT_ID);
    A.custom = !!kept;
    A.loadScene(kept || S.clean(JSON.parse(JSON.stringify(PV.DEFAULT_SCENE))));
    U.hint(PV.t(window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'hintTouch' : 'hintFree'), 9000);

    new ResizeObserver(() => { A.layout(); A.refresh(); }).observe(el('stage'));
    const retheme = () => { A.theme = U.theme(); };
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
    new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    A.last = performance.now(); requestAnimationFrame(A.tick);
  };

  if (window.THREE) A.start();
  else el('stage').insertAdjacentHTML('beforeend', '<p style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center">' + (PV.lang === 'pt' ? 'Não foi possível carregar o motor 3D. Verifique a conexão e recarregue.' : 'The 3D engine could not load. Check the connection and reload.') + '</p>');
})(window.PV);
</script>
</body>
